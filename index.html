<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오답싹싹 - AI 스마트 오답노트</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body { font-family: "Pretendard", -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; }
    .scrollbar-none::-webkit-scrollbar { display: none; }
    .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fadeIn { animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- SVG Icons ---
    const IconBrain = ({ className = "w-6 h-6" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/></svg>
    );
    const IconBookOpen = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
    );
    const IconRotateCcw = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>

    const IconBarChart2 = ({ className = "w-4 h-4" }) => (

    const IconCamera = ({ className = "w-4 h-4" }) => (

    const IconFileText = ({ className = "w-5 h-5" }) => (

    );
    const IconClock = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
    );
    const IconCheckCircle = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
    );
    const IconAward = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
    );
    const IconSearch = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
    );
    const IconPlus = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/></svg>
    );
    const IconTrash2 = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
    );
    const IconChevronRight = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5l7 7-7 7"/></svg>
    );
    const IconChevronLeft = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 19l-7-7 7-7"/></svg>
    );
    const IconXCircle = ({ className = "w-6 h-6" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
    );
    const IconSparkles = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"/></svg>
    );
    const IconEye = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
    );
    const IconEyeOff = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858-5.858A9.954 9.954 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m-4.692-4.692a3 3 0 00-4.243-4.243M3 3l18 18"/></svg>
    );
    const IconHelpCircle = ({ className = "w-10 h-10" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
    );
    const IconArrowRight = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
    );
    const IconRefreshCw = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
    );
    const IconUpload = ({ className = "w-6 h-6" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
    );
    const IconCheck = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7"/></svg>
    );

    const SUBJECT_CONFIG = {
      '수학': { color: 'bg-blue-500', badge: 'bg-blue-100 text-blue-800' },
      '영어': { color: 'bg-emerald-500', badge: 'bg-emerald-100 text-emerald-800' },
      '국어': { color: 'bg-amber-500', badge: 'bg-amber-100 text-amber-800' },
      '과학': { color: 'bg-purple-500', badge: 'bg-purple-100 text-purple-800' },
      '사회': { color: 'bg-rose-500', badge: 'bg-rose-100 text-rose-800' },
      '한국사': { color: 'bg-teal-500', badge: 'bg-teal-100 text-teal-800' },
      '기타': { color: 'bg-slate-500', badge: 'bg-slate-100 text-slate-800' }
    };

    const createSvgDataUrl = (title, subject, color) => {
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
        <rect width="600" height="400" fill="#f8fafc"/>
        <rect x="20" y="20" width="560" height="360" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
        <rect x="40" y="40" width="120" height="32" rx="6" fill="${color}"/>
        <text x="100" y="61" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">${subject}</text>
        <text x="40" y="110" fill="#1e293b" font-size="20" font-weight="bold">${title}</text>
        <line x1="40" y1="130" x2="560" y2="130" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>
        <rect x="40" y="160" width="520" height="80" rx="8" fill="#f1f5f9"/>
        <text x="60" y="195" fill="#475569" font-size="15">문제: 사진 등록 또는 AI 분류 문제 확인</text>
        <text x="60" y="220" fill="#dc2626" font-size="14" font-weight="bold">❌ 내 오답 기록 데이터</text>
        <rect x="40" y="260" width="520" height="90" rx="8" fill="#ecfdf5"/>
        <text x="60" y="295" fill="#047857" font-size="14" font-weight="bold">💡 정답 해설 및 개념</text>
      </svg>`;
      return `data:image/svg+xml;utf8,${encodeURIComponent(svg)}`;
    };

    function App() {
      const [notes, setNotes] = useState(() => {
        const saved = localStorage.getItem('smart_mistake_notes');
        return saved ? JSON.parse(saved) : [];
      });

      const [activeTab, setActiveTab] = useState('notes');
      const [selectedSubject, setSelectedSubject] = useState('전체');
      const [masteryFilter, setMasteryFilter] = useState('all');
      const [searchQuery, setSearchQuery] = useState('');
      
      const [isUploadModalOpen, setIsUploadModalOpen] = useState(false);
      const [selectedNote, setSelectedNote] = useState(null);
      const [isBlindMode, setIsBlindMode] = useState(true);

      const [uploadImage, setUploadImage] = useState(null);
      const [isAnalyzing, setIsAnalyzing] = useState(false);
      const [formData, setFormData] = useState({
        subject: '수학',
        topic: '',
        questionText: '',
        myWrongAnswer: '',
        correctSolution: '',
        tags: '',
        difficulty: '중'
      });

      const [isGeneratingQuiz, setIsGeneratingQuiz] = useState(false);
      const [generatedQuiz, setGeneratedQuiz] = useState(null);
      const [userQuizAnswer, setUserQuizAnswer] = useState('');
      const [showQuizResult, setShowQuizResult] = useState(false);

      const [studyIndex, setStudyIndex] = useState(0);
      const [showStudyAnswer, setShowStudyAnswer] = useState(false);

      const [deleteConfirmId, setDeleteConfirmId] = useState(null);
      const [toastMessage, setToastMessage] = useState(null);

      const triggerToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 3000);
      };

      useEffect(() => {
        localStorage.setItem('smart_mistake_notes', JSON.stringify(notes));
      }, [notes]);

      const callGeminiApi = async (payload, model = 'gemini-3-flash-preview') => {
        const apiKey = "";
        const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;

        let retries = 3;
        let delay = 1000;
        
        for (let i = 0; i < retries; i++) {
          try {
            const response = await fetch(apiUrl, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });
            if (response.ok) return await response.json();
          } catch (err) {
            if (i === retries - 1) throw err;
          }
          await new Promise(r => setTimeout(r, delay));
          delay *= 2;
        }
        throw new Error('Gemini API 호출 오류');
      };

      const handleImageChange = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onloadend = () => setUploadImage(reader.result);
          reader.readAsDataURL(file);
        }
      };

      const handleAnalyzeImage = async () => {
        if (!uploadImage) return;
        setIsAnalyzing(true);
        try {
          const base64Data = uploadImage.split(',')[1];
          const mimeType = uploadImage.split(';')[0].split(':')[1] || 'image/jpeg';

          const promptText = `이 이미지는 학생의 시험지/문제집 사진입니다. 오답노트 작성을 위해 JSON 규격으로 분류해주세요:
- subject: 과목 ('수학', '국어', '영어', '과학', '사회', '한국사', '기타' 중 선택)
- topic: 단원명 또는 세부 주제
- questionText: 문제 텍스트 요약
- myWrongAnswer: 학생 오답 추정
- correctSolution: 해설 및 정답 풀이
- tags: 태그 키워드 3개 배열
- difficulty: '상', '중', '하' 중 선택`;

          const payload = {
            contents: [{ parts: [{ text: promptText }, { inlineData: { mimeType, data: base64Data } }] }],
            generationConfig: {
              responseMimeType: "application/json",
              responseSchema: {
                type: "OBJECT",
                properties: {
                  subject: { type: "STRING" },
                  topic: { type: "STRING" },
                  questionText: { type: "STRING" },
                  myWrongAnswer: { type: "STRING" },
                  correctSolution: { type: "STRING" },
                  tags: { type: "ARRAY", items: { type: "STRING" } },
                  difficulty: { type: "STRING" }
                },
                required: ["subject", "topic", "questionText", "correctSolution", "tags", "difficulty"]
              }
            }
          };

          const data = await callGeminiApi(payload);
          const content = data.candidates?.[0]?.content?.parts?.[0]?.text;
          if (content) {
            const parsed = JSON.parse(content);
            setFormData({
              subject: parsed.subject || '수학',
              topic: parsed.topic || '',
              questionText: parsed.questionText || '',
              myWrongAnswer: parsed.myWrongAnswer || '',
              correctSolution: parsed.correctSolution || '',
              tags: Array.isArray(parsed.tags) ? parsed.tags.join(', ') : '',
              difficulty: parsed.difficulty || '중'
            });
            triggerToast('AI 분석이 완료되었습니다!');
          }
        } catch (error) {
          console.error(error);
          triggerToast('AI 분석 중 오류가 발생했습니다. 직접 입력해 주세요.');
        } finally {
          setIsAnalyzing(false);
        }
      };

      const handleSaveNote = (e) => {
        e.preventDefault();
        const newNote = {
          id: `note-${Date.now()}`,
          subject: formData.subject,
          topic: formData.topic || '단원 미지정',
          questionText: formData.questionText || '내용 없음',
          myWrongAnswer: formData.myWrongAnswer || '',
          correctSolution: formData.correctSolution || '',
          tags: formData.tags ? formData.tags.split(',').map(t => t.trim()).filter(Boolean) : [formData.subject],
          difficulty: formData.difficulty,
          mastery: 'review',
          reviewCount: 0,
          createdAt: new Date().toISOString(),
          imageUrl: uploadImage || createSvgDataUrl(formData.topic || '오답 노트', formData.subject, '#64748b')
        };

        setNotes([newNote, ...notes]);
        setIsUploadModalOpen(false);
        resetUploadForm();
        triggerToast('새 오답노트가 저장되었습니다.');
      };

      const resetUploadForm = () => {
        setUploadImage(null);
        setFormData({
          subject: '수학',
          topic: '',
          questionText: '',
          myWrongAnswer: '',
          correctSolution: '',
          tags: '',
          difficulty: '중'
        });
      };

      const handleDeleteNote = (id) => {
        setDeleteConfirmId(id);
      };

      const confirmDelete = () => {
        if (deleteConfirmId) {
          setNotes(notes.filter(n => n.id !== deleteConfirmId));
          if (selectedNote?.id === deleteConfirmId) setSelectedNote(null);
          setDeleteConfirmId(null);
          triggerToast('오답노트가 삭제되었습니다.');
        }
      };

      const handleToggleMastery = (id) => {
        setNotes(notes.map(n => {
          if (n.id === id) {
            const nextState = n.mastery === 'mastered' ? 'review' : 'mastered';
            return { 
              ...n, 
              mastery: nextState,
              reviewCount: nextState === 'mastered' ? n.reviewCount + 1 : n.reviewCount 
            };
          }
          return n;
        }));
        if (selectedNote && selectedNote.id === id) {
          setSelectedNote(prev => ({
            ...prev,
            mastery: prev.mastery === 'mastered' ? 'review' : 'mastered'
          }));
        }
      };

      const handleGenerateSimilarQuiz = async (note) => {
        setIsGeneratingQuiz(true);
        setGeneratedQuiz(null);
        setUserQuizAnswer('');
        setShowQuizResult(false);

        try {
          const promptText = `오답 문제의 핵심 개념을 이용해 유사한 쌍둥이 변형 문제 1개를 생성하세요.
- 과목: ${note.subject}
- 단원: ${note.topic}
- 문제: ${note.questionText}
- 풀이: ${note.correctSolution}

JSON 형식:
- newQuestion: 유사 문제
- hint: 힌트
- answer: 정답
- explanation: 상세 풀이`;

          const payload = {
            contents: [{ parts: [{ text: promptText }] }],
            generationConfig: {
              responseMimeType: "application/json",
              responseSchema: {
                type: "OBJECT",
                properties: {
                  newQuestion: { type: "STRING" },
                  hint: { type: "STRING" },
                  answer: { type: "STRING" },
                  explanation: { type: "STRING" }
                },
                required: ["newQuestion", "hint", "answer", "explanation"]
              }
            }
          };

          const resData = await callGeminiApi(payload);
          const text = resData.candidates?.[0]?.content?.parts?.[0]?.text;
          if (text) setGeneratedQuiz(JSON.parse(text));
        } catch (err) {
          console.error(err);
          triggerToast('유사 문제 생성 실패');
        } finally {
          setIsGeneratingQuiz(false);
        }
      };

      const filteredNotes = notes.filter(note => {
        const matchesSubject = selectedSubject === '전체' || note.subject === selectedSubject;
        const matchesMastery = masteryFilter === 'all' || note.mastery === masteryFilter;
        const matchesQuery = searchQuery === '' || 
          note.topic.toLowerCase().includes(searchQuery.toLowerCase()) ||
          note.questionText.toLowerCase().includes(searchQuery.toLowerCase()) ||
          note.tags.some(t => t.toLowerCase().includes(searchQuery.toLowerCase()));
        return matchesSubject && matchesMastery && matchesQuery;
      });

      const studyNotesList = notes.filter(n => n.mastery === 'review');
      const totalCount = notes.length;
      const masteredCount = notes.filter(n => n.mastery === 'mastered').length;
      const reviewCount = notes.filter(n => n.mastery === 'review').length;
      const masteryRate = totalCount > 0 ? Math.round((masteredCount / totalCount) * 100) : 0;

      const subjectStats = Object.keys(SUBJECT_CONFIG).filter(s => s !== '기타').map(subj => {
        const count = notes.filter(n => n.subject === subj).length;
        const mastered = notes.filter(n => n.subject === subj && n.mastery === 'mastered').length;
        return {
          subject: subj,
          count,
          mastered,
          rate: count > 0 ? Math.round((mastered / count) * 100) : 0
        };
      });

      return (
        <div className="min-h-screen flex flex-col relative">
          {/* TOAST NOTIFICATION */}
          {toastMessage && (
            <div className="fixed top-20 right-4 z-50 bg-slate-900 text-white px-4 py-3 rounded-xl shadow-2xl text-xs font-bold animate-fadeIn flex items-center gap-2">

              <div className="bg-white rounded-3xl max-w-2xl w-full max-h-[90vh] overflow-y-auto shadow-2xl border border-slate-100">
                <div className="p-6 border-b border-slate-100 flex items-center justify-between sticky top-0 bg-white z-10">
                  <div className="flex items-center gap-3">
                    <span className={`px-3 py-1 rounded-lg text-xs font-extrabold ${SUBJECT_CONFIG[selectedNote.subject]?.badge}`}>
                      {selectedNote.subject}
                    </span>
                    <h2 className="text-lg font-bold text-slate-800 line-clamp-1">{selectedNote.topic}</h2>
                  </div>
                  <button onClick={() => { setSelectedNote(null); setGeneratedQuiz(null); }} className="p-2 text-slate-400 hover:text-slate-600">
                    <IconXCircle className="w-6 h-6" />
                  </button>
                </div>

                <div className="p-6 space-y-6">
                  {selectedNote.imageUrl && (
                    <div className="rounded-2xl overflow-hidden border border-slate-200 bg-slate-50 max-h-72 flex items-center justify-center">
                      <img src={selectedNote.imageUrl} alt="오답 이미지" className="max-h-72 object-contain" />
                    </div>
                  )}

                  <div className="space-y-2">
                    <label className="text-xs font-bold text-slate-400">문제 내용</label>
                    <div className="bg-slate-50 p-4 rounded-2xl border border-slate-200 text-slate-800 font-medium text-sm leading-relaxed">
                      {selectedNote.questionText}
                    </div>
                  </div>

                  <div className="flex items-center justify-between bg-slate-100 p-3 rounded-xl text-xs font-bold">
                    <span className="text-slate-600">블라인드 복습 모드 (정답 가리기)</span>
                    <button
                      onClick={() => setIsBlindMode(!isBlindMode)}
                      className="px-3 py-1.5 bg-white text-indigo-600 rounded-lg shadow-sm border border-slate-200 flex items-center gap-1.5"
                    >
                      {isBlindMode ? <IconEye className="w-4 h-4" /> : <IconEyeOff className="w-4 h-4" />}
                      {isBlindMode ? '해설 보기' : '해설 가리기'}
                    </button>
                  </div>

                  {!isBlindMode && (
                    <div className="space-y-4 animate-fadeIn">
                      {selectedNote.myWrongAnswer && (
                        <div className="bg-red-50 border border-red-200 p-4 rounded-2xl text-red-800">
                          <p className="text-xs font-bold text-red-600 mb-1">❌ 내가 작성한 오답</p>
                          <p className="text-sm font-medium">{selectedNote.myWrongAnswer}</p>
                        </div>
                      )}
                      <div className="bg-emerald-50 border border-emerald-200 p-4 rounded-2xl text-emerald-900">
                        <p className="text-xs font-bold text-emerald-700 mb-1">💡 정답 해설 및 개념</p>
                        <p className="text-sm font-medium whitespace-pre-line leading-relaxed">{selectedNote.correctSolution}</p>
                      </div>
                    </div>
                  )}

                  <div className="border-t border-slate-200 pt-6 space-y-4">
                    <div className="flex items-center justify-between">
                      <div className="flex items-center gap-2">
                        <IconSparkles className="w-5 h-5 text-indigo-600" />
                        <h3 className="font-bold text-slate-800 text-sm">AI 쌍둥이/유사 문제 풀어보기</h3>
                      </div>
                      {!generatedQuiz && (
                        <button
                          disabled={isGeneratingQuiz}
                          onClick={() => handleGenerateSimilarQuiz(selectedNote)}
                          className="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold px-4 py-2 rounded-xl transition-all shadow-md disabled:opacity-50 flex items-center gap-1.5"
                        >
                          {isGeneratingQuiz ? '생성 중...' : '생성하기'}
                        </button>
                      )}
                    </div>

                    {generatedQuiz && (
                      <div className="bg-indigo-50/70 border border-indigo-200 p-5 rounded-2xl space-y-4 text-xs">
                        <div className="space-y-2">
                          <span className="font-extrabold text-indigo-900 bg-indigo-200 px-2 py-0.5 rounded">유사 문제</span>
                          <p className="text-slate-800 font-bold text-sm leading-relaxed">{generatedQuiz.newQuestion}</p>
                        </div>
                        <div className="space-y-2">
                          <p className="text-slate-500 font-medium">힌트: {generatedQuiz.hint}</p>
                          <div className="flex items-center gap-2">
                            <input
                              type="text"
                              placeholder="정답 입력"
                              value={userQuizAnswer}
                              onChange={(e) => setUserQuizAnswer(e.target.value)}
                              className="flex-1 px-3 py-2 bg-white border border-slate-300 rounded-xl text-sm"
                            />
                            <button onClick={() => setShowQuizResult(true)} className="bg-indigo-600 text-white font-bold px-4 py-2 rounded-xl">
                              확인
                            </button>
                          </div>
                        </div>

                        {showQuizResult && (
                          <div className="mt-3 p-3 bg-white rounded-xl border border-indigo-200 space-y-1">
                            <p className="font-bold text-emerald-600">정답: {generatedQuiz.answer}</p>
                            <p className="text-slate-600 font-medium">{generatedQuiz.explanation}</p>
                          </div>
                        )}
                      </div>
                    )}
                  </div>
                </div>

                <div className="p-6 bg-slate-50 border-t border-slate-100 flex items-center justify-between">
                  <button onClick={() => handleDeleteNote(selectedNote.id)} className="text-red-500 hover:text-red-700 text-xs font-bold flex items-center gap-1">
                    <IconTrash2 className="w-4 h-4" /> 오답노트 삭제
                  </button>
                  <button
                    onClick={() => handleToggleMastery(selectedNote.id)}
                    className={`px-4 py-2 rounded-xl text-xs font-bold transition-all flex items-center gap-1.5 shadow-sm ${
                      selectedNote.mastery === 'mastered' ? 'bg-emerald-600 text-white' : 'bg-amber-500 text-white'
                    }`}
                  >
                    {selectedNote.mastery === 'mastered' ? '복습 필요 상태로 변경' : '완벽 마스터로 완료'}
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* UPLOAD MODAL */}
          {isUploadModalOpen && (
            <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
              <div className="bg-white rounded-3xl max-w-2xl w-full max-h-[90vh] overflow-y-auto shadow-2xl border border-slate-100">
                <div className="p-6 border-b border-slate-100 flex items-center justify-between sticky top-0 bg-white z-10">
                  <div className="flex items-center gap-2">
                    <IconCamera className="w-5 h-5 text-indigo-600" />
                    <h2 className="text-lg font-bold text-slate-800">새 오답노트 등록 (AI 자동 인식)</h2>
                  </div>
                  <button onClick={() => { setIsUploadModalOpen(false); resetUploadForm(); }} className="p-2 text-slate-400 hover:text-slate-600">
                    <IconXCircle className="w-6 h-6" />
                  </button>
                </div>

                <form onSubmit={handleSaveNote} className="p-6 space-y-6">
                  <div className="space-y-3">
                    <label className="text-xs font-bold text-slate-500">1. 문제 사진 선택 / 촬영</label>
                    {uploadImage ? (
                      <div className="relative rounded-2xl overflow-hidden border border-slate-200 bg-slate-900">
                        <img src={uploadImage} alt="미리보기" className="w-full max-h-64 object-contain mx-auto" />
                        <button type="button" onClick={() => setUploadImage(null)} className="absolute top-3 right-3 bg-black/70 text-white p-2 rounded-full">
                          <IconTrash2 className="w-4 h-4" />
                        </button>
                      </div>
                    ) : (
                      <label className="border-2 border-dashed border-slate-300 rounded-2xl p-8 text-center cursor-pointer hover:border-indigo-500 transition-all flex flex-col items-center justify-center space-y-3">
                        <div className="w-12 h-12 rounded-full bg-indigo-50 text-indigo-600 flex items-center justify-center">
                          <IconUpload className="w-6 h-6" />
                        </div>
                        <div>
                          <p className="text-sm font-bold text-slate-700">사진 업로드 또는 촬영</p>
                          <p className="text-xs text-slate-400 mt-1">PNG, JPG 이미지 지원</p>
                        </div>
                        <input type="file" accept="image/*" onChange={handleImageChange} className="hidden" />
                      </label>
                    )}

                    {uploadImage && (
                      <button
                        type="button"
                        disabled={isAnalyzing}
                        onClick={handleAnalyzeImage}
                        className="w-full bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-bold py-3 rounded-xl text-xs hover:from-indigo-700 flex items-center justify-center gap-2 disabled:opacity-50 shadow-md"
                      >
                        {isAnalyzing ? <><IconRefreshCw className="w-4 h-4 animate-spin" /> Gemini AI 분석 중...</> : <><IconSparkles className="w-4 h-4" /> AI 자동 분석 실행</>}
                      </button>
                    )}
                  </div>

                  <div className="space-y-4 border-t border-slate-100 pt-6">
                    <div className="grid grid-cols-2 gap-4">
                      <div>
                        <label className="text-xs font-bold text-slate-700 block mb-1.5">과목 선택</label>
                        <select
                          value={formData.subject}
                          onChange={(e) => setFormData({ ...formData, subject: e.target.value })}
                          className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold text-slate-800"
                        >
                          {Object.keys(SUBJECT_CONFIG).map(subj => <option key={subj} value={subj}>{subj}</option>)}
                        </select>
                      </div>
                      <div>
                        <label className="text-xs font-bold text-slate-700 block mb-1.5">난이도</label>
                        <select
                          value={formData.difficulty}
                          onChange={(e) => setFormData({ ...formData, difficulty: e.target.value })}
                          className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold text-slate-800"
                        >
                          <option value="하">하 (쉬움)</option>
                          <option value="중">중 (보통)</option>
                          <option value="상">상 (어려움)</option>
                        </select>
                      </div>
                    </div>

                    <div>
                      <label className="text-xs font-bold text-slate-700 block mb-1.5">단원 / 세부 주제</label>
                      <input
                        type="text"
                        required
                        placeholder="예: 이차방정식 근과 계수의 관계"
                        value={formData.topic}
                        onChange={(e) => setFormData({ ...formData, topic: e.target.value })}
                        className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm"
                      />
                    </div>

                    <div>
                      <label className="text-xs font-bold text-slate-700 block mb-1.5">문제 내용</label>
                      <textarea
                        rows={3}
                        placeholder="문제 텍스트를 입력하거나 AI 자동 분석을 이용하세요."
                        value={formData.questionText}
                        onChange={(e) => setFormData({ ...formData, questionText: e.target.value })}
                        className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm"
                      />
                    </div>

                    <div>
                      <label className="text-xs font-bold text-slate-700 block mb-1.5">내가 작성한 오답 (선택)</label>
                      <input
                        type="text"
                        placeholder="실수한 답"
                        value={formData.myWrongAnswer}
                        onChange={(e) => setFormData({ ...formData, myWrongAnswer: e.target.value })}
                        className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm"
                      />
                    </div>

                    <div>
                      <label className="text-xs font-bold text-slate-700 block mb-1.5">정답 풀이 및 해설</label>
                      <textarea
                        rows={4}
                        placeholder="풀이 과정을 입력하세요."
                        value={formData.correctSolution}
                        onChange={(e) => setFormData({ ...formData, correctSolution: e.target.value })}
                        className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm"
                      />
                    </div>

                    <div>
                      <label className="text-xs font-bold text-slate-700 block mb-1.5">태그 (쉼표 구분)</label>
                      <input
                        type="text"
                        placeholder="예: 계산실수, 개념이해"
                        value={formData.tags}
                        onChange={(e) => setFormData({ ...formData, tags: e.target.value })}
                        className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm"
                      />
                    </div>
                  </div>

                  <div className="flex items-center justify-end gap-3 pt-4 border-t border-slate-100">
                    <button type="button" onClick={() => setIsUploadModalOpen(false)} className="px-4 py-2.5 text-slate-600 rounded-xl font-bold text-sm">
                      취소
                    </button>
                    <button type="submit" className="bg-indigo-600 text-white font-bold px-6 py-2.5 rounded-xl text-sm shadow-md">
                      오답노트 저장하기
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* DELETE CONFIRMATION MODAL */}
          {deleteConfirmId && (
            <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-sm w-full p-6 space-y-4 text-center border border-slate-200 shadow-2xl">
                <div className="w-12 h-12 rounded-full bg-red-100 text-red-600 flex items-center justify-center mx-auto">
                  <IconTrash2 className="w-6 h-6" />
                </div>
                <div>
                  <h3 className="text-base font-bold text-slate-800">오답노트 삭제</h3>
                  <p className="text-xs text-slate-500 mt-1">정말로 이 오답노트를 삭제하시겠습니까?</p>
                </div>
                <div className="flex items-center gap-3 pt-2">
                  <button onClick={() => setDeleteConfirmId(null)} className="flex-1 py-2.5 bg-slate-100 font-bold text-slate-700 text-xs rounded-xl">
                    취소
                  </button>
                  <button onClick={confirmDelete} className="flex-1 py-2.5 bg-red-600 text-white font-bold text-xs rounded-xl shadow-md">
                    삭제하기
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
